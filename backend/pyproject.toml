[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netstudio-api"
version = "0.1.0"
description = "NetStudio network inventory, telemetry and SSH management API"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "asyncssh>=2.24,<3",
  "bcrypt>=4.2,<6",
  "cryptography>=46,<52",
  "defusedxml==0.7.1",
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "ntc-templates==9.3.0",
  "Pillow>=13.0,<14",
  "psycopg[binary]>=3.2,<4",
  "pysnmp==7.1.30",
  "sqlalchemy>=2.0,<3",
  "textfsm==2.1.0",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/KES-KING/NetStudio"
Documentation = "https://github.com/KES-KING/NetStudio#readme"
Issues = "https://github.com/KES-KING/NetStudio/issues"

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
