[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stocc-netstudio-api"
version = "0.1.0"
description = "Stocc NetStudio API vertical slice"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "asyncssh>=2.24,<3",
  "bcrypt>=4.2,<6",
  "cryptography>=46,<52",
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
