name: ${COMPOSE_PROJECT_NAME:-stocc-netstudio}

x-api-service: &api-service
  image: stocc-netstudio-api:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    STOCC_ENV: ${STOCC_ENV:-development}
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://stocc:stocc@postgres:5432/stocc}
  networks:
    - database
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  secrets-init:
    <<: *api-service
    user: "0:0"
    command: ["python", "-m", "app.keyring", "initialize"]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    volumes:
      - stocc-keyring:/run/secrets
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stocc}
      POSTGRES_USER: ${POSTGRES_USER:-stocc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocc}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stocc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - database
    stop_grace_period: 30s

  migrate:
    <<: *api-service
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-service
    restart: unless-stopped
    init: true
    environment:
      STOCC_ENV: ${STOCC_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://stocc:stocc@postgres:5432/stocc}
      STOCC_ALLOWED_ORIGINS: ${STOCC_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      STOCC_SSH_ALLOWED_CIDRS: ${STOCC_SSH_ALLOWED_CIDRS:-}
      STOCC_KEYRING_FILE: /run/secrets/stocc-keyring.json
    volumes:
      - stocc-keyring:/run/secrets:ro
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - database
      - application
    stop_grace_period: 20s

  collector-worker:
    <<: *api-service
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    init: true
    environment:
      STOCC_ENV: ${STOCC_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://stocc:stocc@postgres:5432/stocc}
      STOCC_ALLOWED_ORIGINS: ${STOCC_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      STOCC_SSH_ALLOWED_CIDRS: ${STOCC_SSH_ALLOWED_CIDRS:-}
      STOCC_KEYRING_FILE: /run/secrets/stocc-keyring.json
    volumes:
      - stocc-keyring:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - application
    stop_grace_period: 20s

  web:
    image: stocc-netstudio-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - application
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

  gateway:
    image: nginx:stable-alpine
    user: "101:101"
    restart: unless-stopped
    entrypoint: ["nginx", "-g", "daemon off;"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/routes.conf:/etc/nginx/routes.conf:ro
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/gateway-health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - application
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  stocc-postgres:
  stocc-keyring:

networks:
  database:
  application:
