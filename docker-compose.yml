name: ${COMPOSE_PROJECT_NAME:-netstudio}

x-api-service: &api-service
  image: netstudio-api:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      NETSTUDIO_BUILD_REVISION: ${NETSTUDIO_BUILD_REVISION:-unknown}
  environment:
    NETSTUDIO_ENV: ${NETSTUDIO_ENV:-development}
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://netstudio:netstudio@postgres:5432/netstudio}
  networks:
    - database
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  secrets-init:
    <<: *api-service
    user: "0:0"
    command: ["python", "-m", "app.keyring", "initialize"]
    environment:
      NETSTUDIO_ENV: ${NETSTUDIO_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://netstudio:netstudio@postgres:5432/netstudio}
      NETSTUDIO_PROBE_BOOTSTRAP_EXPORT_FILE: /run/netstudio-probe/bootstrap.token
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    volumes:
      - netstudio-keyring:/run/secrets
      - netstudio-probe-state:/run/netstudio-probe
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netstudio}
      POSTGRES_USER: ${POSTGRES_USER:-netstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netstudio}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - netstudio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - database
    stop_grace_period: 30s

  migrate:
    <<: *api-service
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-service
    restart: unless-stopped
    init: true
    environment:
      NETSTUDIO_ENV: ${NETSTUDIO_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://netstudio:netstudio@postgres:5432/netstudio}
      NETSTUDIO_ALLOWED_ORIGINS: ${NETSTUDIO_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      NETSTUDIO_SSH_ALLOWED_CIDRS: ${NETSTUDIO_SSH_ALLOWED_CIDRS:-}
      NETSTUDIO_CONTROLLER_ALLOWED_CIDRS: ${NETSTUDIO_CONTROLLER_ALLOWED_CIDRS:-}
      NETSTUDIO_UPDATES_CHECK_ENABLED: ${NETSTUDIO_UPDATES_CHECK_ENABLED:-1}
      NETSTUDIO_DRIVER_CATALOG_V2: ${NETSTUDIO_DRIVER_CATALOG_V2:-1}
      NETSTUDIO_ALLOW_SNMP_V2C: ${NETSTUDIO_ALLOW_SNMP_V2C:-0}
    volumes:
      - netstudio-keyring:/run/secrets:ro
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - database
      - application
    stop_grace_period: 20s

  collector-worker:
    <<: *api-service
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    init: true
    environment:
      NETSTUDIO_ENV: ${NETSTUDIO_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://netstudio:netstudio@postgres:5432/netstudio}
      NETSTUDIO_ALLOWED_ORIGINS: ${NETSTUDIO_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      NETSTUDIO_SSH_ALLOWED_CIDRS: ${NETSTUDIO_SSH_ALLOWED_CIDRS:-}
      NETSTUDIO_CONTROLLER_ALLOWED_CIDRS: ${NETSTUDIO_CONTROLLER_ALLOWED_CIDRS:-}
      NETSTUDIO_ALLOW_SNMP_V2C: ${NETSTUDIO_ALLOW_SNMP_V2C:-0}
    volumes:
      - netstudio-keyring:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - application
    stop_grace_period: 20s

  updater:
    image: netstudio-updater:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile.updater
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://netstudio:netstudio@postgres:5432/netstudio}
    # Compose 2.37.2+ delegates the selected local Engine socket and Docker
    # credentials only to this isolated service. API/web/worker never receive it.
    use_api_socket: true
    volumes:
      - .:/workspace:ro
      - netstudio-updater-state:/var/lib/netstudio-updater
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      collector-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "docker", "version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  network-probe-agent:
    image: netstudio-api:${IMAGE_TAG:-local}
    command: ["python", "-m", "app.network_probe_agent", "--automatic"]
    restart: unless-stopped
    init: true
    user: "0:0"
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Development uses the loopback API binding. Production must set this to
      # the installation's HTTPS gateway origin.
      NETSTUDIO_PROBE_API_URL: ${NETSTUDIO_PROBE_API_URL:-http://127.0.0.1:${API_PORT:-8000}}
      NETSTUDIO_PROBE_BOOTSTRAP_TOKEN_FILE: /run/netstudio-probe/bootstrap.token
    volumes:
      - netstudio-probe-state:/run/netstudio-probe
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    stop_grace_period: 15s

  web:
    image: netstudio-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NETSTUDIO_BUILD_REVISION: ${NETSTUDIO_BUILD_REVISION:-unknown}
    restart: unless-stopped
    init: true
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - application
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

  gateway:
    image: nginx:stable-alpine
    user: "101:101"
    restart: unless-stopped
    entrypoint: ["nginx", "-g", "daemon off;"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/routes.conf:/etc/nginx/routes.conf:ro
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/gateway-health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - application
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  netstudio-postgres:
    name: ${NETSTUDIO_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-netstudio}_netstudio-postgres}
    external: ${NETSTUDIO_EXTERNAL_VOLUMES:-false}
  netstudio-keyring:
    name: ${NETSTUDIO_KEYRING_VOLUME:-${COMPOSE_PROJECT_NAME:-netstudio}_netstudio-keyring}
    external: ${NETSTUDIO_EXTERNAL_VOLUMES:-false}
  netstudio-probe-state:
    name: ${NETSTUDIO_PROBE_STATE_VOLUME:-${COMPOSE_PROJECT_NAME:-netstudio}_netstudio-probe-state}
    external: ${NETSTUDIO_EXTERNAL_VOLUMES:-false}
  netstudio-updater-state:
    name: ${NETSTUDIO_UPDATER_STATE_VOLUME:-${COMPOSE_PROJECT_NAME:-netstudio}_netstudio-updater-state}

networks:
  database:
  application:
